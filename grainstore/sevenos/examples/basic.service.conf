# Basic service configuration example for sevenos-init
# Format: name:command:working_dir:restart_policy:dependencies
#
# Fields:
# - name: service name (required)
# - command: executable and arguments (required)
# - working_dir: working directory (optional, default: /)
# - restart_policy: always, never, on_failure, on_success (optional, default: always)
# - dependencies: comma-separated list of service names (optional)

# Web server service
web:/usr/bin/nginx:/var/www:always:network,storage

# Database service
db:/usr/bin/postgres:/var/lib/postgres:always:storage

# Network service (no dependencies)
network:/usr/bin/networkd:/etc/network:always:

# Storage service (no dependencies)
storage:/usr/bin/storaged:/var/storage:always:

