# Vantage VM - Limine Boot Configuration
# Why: Configure Limine bootloader for Vantage VM (RISC-V emulator).
# Reference: https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md
#
# Architecture:
#   Vantage VM boots on x86_64 via Limine
#   Vantage loads Basin kernel (RISC-V ELF) from module
#   Vantage emulates RISC-V64 to run Basin

# Timeout before auto-boot (seconds)
timeout: 5

# Default entry
default_entry: 1

# Vantage VM with Basin Kernel
/Vantage VM (Basin Kernel)
    protocol: limine
    kernel_path: boot():/boot/vantage
    # Basin kernel loaded as module (RISC-V ELF)
    module_path: boot():/boot/basin-rv64

# Vantage VM with serial console
/Vantage VM (Serial Console)
    protocol: limine
    kernel_path: boot():/boot/vantage
    cmdline: serial=1

# Vantage VM with verbose boot
/Vantage VM (Verbose)
    protocol: limine
    kernel_path: boot():/boot/vantage
    cmdline: verbose=1 debug=1
